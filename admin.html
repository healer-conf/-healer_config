<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Roya Nail Studio — Admin</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Vazirmatn,sans-serif;
    background:
        linear-gradient(135deg,#fff1f6,#f9e5ec),
        url("bg.jpg") center/cover fixed;
    color:#4d3942;
}

.container{
    width:min(94%,650px);
    margin:auto;
    padding:25px 0 50px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    box-shadow:0 10px 30px rgba(150,80,105,.12);
}

.header h1{
    margin:10px 0 3px;
    font-size:23px;
}

.header p{
    margin:0;
    color:#9b7482;
    font-size:12px;
}

.card{
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(15px);
    border:1px solid #fff;
    border-radius:22px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 12px 35px rgba(145,83,105,.1);
}

.title{
    font-weight:800;
    margin-bottom:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.stat{
    background:#fff4f7;
    padding:13px 5px;
    text-align:center;
    border-radius:15px;
}

.stat strong{
    display:block;
    font-size:20px;
    color:#b8647f;
}

.stat span{
    font-size:10px;
    color:#92717d;
}

.booking{
    border:1px solid #f0dce3;
    border-radius:17px;
    padding:14px;
    margin-bottom:10px;
    background:#fffafa;
}

.booking-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.name{
    font-weight:800;
}

.id{
    font-size:10px;
    color:#a78591;
}

.details{
    font-size:12px;
    line-height:2;
    margin-top:8px;
}

.status{
    display:inline-block;
    border-radius:20px;
    padding:4px 9px;
    font-size:10px;
    background:#fff0f4;
    color:#a85d76;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

button{
    width:100%;
    border:0;
    padding:12px;
    border-radius:13px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
}

.accept{
    background:#d68ea5;
    color:white;
}

.reject{
    background:#f7e7ec;
    color:#a45770;
}

.save{
    background:#c97893;
    color:white;
    margin-top:10px;
}

input{
    width:100%;
    padding:12px;
    border-radius:13px;
    border:1px solid #ead6de;
    outline:none;
    font-family:inherit;
    margin-top:6px;
    background:#fff;
}

label{
    font-size:12px;
    display:block;
    margin-top:10px;
}

.holidays{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
}

.holiday{
    background:#fff0f4;
    color:#a45d74;
    padding:7px 10px;
    border-radius:20px;
    font-size:11px;
}

.holiday button{
    width:auto;
    padding:0 4px;
    background:none;
    color:#a45d74;
}

.empty{
    text-align:center;
    color:#9a7b85;
    font-size:13px;
    padding:20px;
}

.service-row{
    display:grid;
    grid-template-columns:1fr 110px;
    gap:8px;
    margin-bottom:8px;
}

.footer{
    text-align:center;
    color:#9c7b86;
    font-size:10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">💅🏻</div>

        <h1>Roya Nail Studio</h1>

        <p>پنل مدیریت نوبت‌ها</p>

    </div>

    <div class="card">

        <div class="title">📊 وضعیت امروز</div>

        <div class="stats">

            <div class="stat">
                <strong id="todayCount">0</strong>
                <span>نوبت امروز</span>
            </div>

            <div class="stat">
                <strong id="pendingCount">0</strong>
                <span>درخواست جدید</span>
            </div>

            <div class="stat">
                <strong id="limitCount">0</strong>
                <span>ظرفیت روزانه</span>
            </div>

        </div>

    </div>

    <div class="card">

        <div class="title">🔔 درخواست‌های جدید</div>

        <div id="pendingBookings"></div>

    </div>

    <div class="card">

        <div class="title">📋 همه نوبت‌ها</div>

        <div id="allBookings"></div>

    </div>

    <div class="card">

        <div class="title">⚙️ تنظیمات نوبت‌دهی</div>

        <label>آدرس مراجعه</label>
        <input id="address" placeholder="مثلاً تهران، خیابان ...">

        <label>پیج ارتباطی</label>
        <input id="instagram" placeholder="_roya021_">

        <label>حداکثر نوبت در روز</label>
        <input id="dailyLimit" type="number" min="1">

        <label>ساعت شروع</label>
        <input id="opening" type="time">

        <label>ساعت پایان</label>
        <input id="closing" type="time">

        <label>فاصله نوبت‌ها به دقیقه</label>
        <input id="slotInterval" type="number" min="15">

        <button class="save" onclick="saveSettings()">
            ذخیره تنظیمات 💾
        </button>

    </div>

    <div class="card">

        <div class="title">🗓️ تعطیل کردن روز</div>

        <input id="holidayDate" type="date">

        <button class="save" onclick="addHoliday()">
            اضافه کردن تعطیلی
        </button>

        <div id="holidayList" class="holidays"></div>

    </div>

    <div class="card">

        <div class="title">💰 قیمت خدمات</div>

        <div id="servicesAdmin"></div>

        <button class="save" onclick="saveServices()">
            ذخیره قیمت‌ها 💾
        </button>

    </div>

    <div class="card">

        <div class="title">🧹 مدیریت اطلاعات تست</div>

        <button class="reject" onclick="clearBookings()">
            حذف تمام نوبت‌های تست
        </button>

    </div>

    <div class="footer">
        Roya Nail Studio • Admin Panel
    </div>

</div>

<script>

const API="http://127.0.0.1:5000/api";

let settings={};
let services={};
let bookings=[];


async function api(url,options={}){

    const response=await fetch(API+url,{
        headers:{
            "Content-Type":"application/json",
            ...(options.headers||{})
        },
        ...options
    });

    let data={};

    try{
        data=await response.json();
    }catch{}

    if(!response.ok){
        throw new Error(data.error || "خطا در ارتباط با سرور");
    }

    return data;
}


function formatPrice(num){

    return Number(num).toLocaleString("fa-IR")+" تومان";

}


function today(){

    const d=new Date();

    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,"0");
    const day=String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;

}


async function loadSettings(){

    const data=await api("/settings");

    settings=data;

    document.getElementById("address").value=
        data.address || "";

    document.getElementById("instagram").value=
        data.instagram || "_roya021_";

    document.getElementById("dailyLimit").value=
        Number(data.daily_limit ?? 4);

    document.getElementById("opening").value=
        data.opening_time || "10:00";

    document.getElementById("closing").value=
        data.closing_time || "20:00";

    document.getElementById("slotInterval").value=
        Number(data.interval ?? 60);

}


async function loadServices(){

    services=await api("/services");

}


async function loadBookings(){

    bookings=await api("/bookings");

}


async function saveSettings(){

    try{

        const holidays=
            settings.holidays || [];

        const body={

            address:
                document.getElementById("address").value.trim(),

            instagram:
                document.getElementById("instagram").value.trim()
                || "_roya021_",

            daily_limit:
                Number(
                    document.getElementById("dailyLimit").value
                ) || 4,

            opening_time:
                document.getElementById("opening").value
                || "10:00",

            closing_time:
                document.getElementById("closing").value
                || "20:00",

            interval:
                Number(
                    document.getElementById("slotInterval").value
                ) || 60,

            holidays:holidays

        };

        const result=await api("/settings",{

            method:"PUT",

            body:JSON.stringify(body)

        });

        settings=result.settings;

        alert("تنظیمات ذخیره شد 🌸");

        await render();

    }catch(error){

        alert(
            "ذخیره تنظیمات انجام نشد.\n\n"+
            error.message
        );

    }

}


async function approveBooking(id){

    try{

        const result=
            await api(
                "/bookings/"+
                encodeURIComponent(id)+
                "/approve",
                {
                    method:"POST"
                }
            );

        alert("نوبت تأیید شد ✅");

        await render();

    }catch(error){

        if(error.message==="daily_limit"){

            alert("ظرفیت این روز تکمیل شده است.");

        }else if(error.message==="time_unavailable"){

            alert("این ساعت قبلاً گرفته شده است.");

        }else{

            alert(
                "تأیید نوبت انجام نشد.\n\n"+
                error.message
            );

        }

        await render();

    }

}


async function rejectBooking(id){

    if(!confirm("این درخواست رد شود؟")){
        return;
    }

    try{

        await api(
            "/bookings/"+
            encodeURIComponent(id)+
            "/reject",
            {
                method:"POST"
            }
        );

        await render();

    }catch(error){

        alert(
            "رد کردن درخواست انجام نشد.\n\n"+
            error.message
        );

    }

}


function renderPending(){

    const box=
        document.getElementById("pendingBookings");

    const data=bookings.filter(
        b=>b.status==="pending"
    );

    if(!data.length){

        box.innerHTML=
            `<div class="empty">
                درخواست جدیدی وجود ندارد 🌸
            </div>`;

        return;

    }

    box.innerHTML="";

    data.forEach(b=>{

        const div=document.createElement("div");

        div.className="booking";

        div.innerHTML=`

            <div class="booking-top">

                <div class="name">
                    ${escapeHtml(b.name)}
                </div>

                <span class="status">
                    در انتظار
                </span>

            </div>

            <div class="details">

                📱 ${escapeHtml(b.phone)}<br>

                📅 ${escapeHtml(b.date)}<br>

                ⏰ ${escapeHtml(b.time)}<br>

                💅 ${escapeHtml(
                    (b.services||[]).join("، ")
                )}<br>

                💰 ${formatPrice(b.total)}

            </div>

            <div class="actions">

                <button class="accept"
                    onclick="approveBooking('${b.id}')">
                    قبول ✓
                </button>

                <button class="reject"
                    onclick="rejectBooking('${b.id}')">
                    رد ×
                </button>

            </div>

        `;

        box.appendChild(div);

    });

}


function renderAll(){

    const box=
        document.getElementById("allBookings");

    const data=
        bookings
        .slice()
        .sort((a,b)=>{

            const aa=
                `${a.date||""} ${a.time||""}`;

            const bb=
                `${b.date||""} ${b.time||""}`;

            return bb.localeCompare(aa);

        });

    if(!data.length){

        box.innerHTML=
            `<div class="empty">
                هنوز نوبتی ثبت نشده.
            </div>`;

        return;

    }

    box.innerHTML="";

    data.forEach(b=>{

        let status="⏳ در انتظار";

        if(b.status==="approved"){
            status="✅ تأیید شده";
        }

        if(b.status==="rejected"){
            status="❌ رد شده";
        }

        const div=
            document.createElement("div");

        div.className="booking";

        div.innerHTML=`

            <div class="booking-top">

                <div class="name">
                    ${escapeHtml(b.name)}
                </div>

                <span class="status">
                    ${status}
                </span>

            </div>

            <div class="details">

                📱 ${escapeHtml(b.phone)}<br>

                📅 ${escapeHtml(b.date)}<br>

                ⏰ ${escapeHtml(b.time)}<br>

                💅 ${escapeHtml(
                    (b.services||[]).join("، ")
                )}<br>

                💰 ${formatPrice(b.total)}

            </div>

        `;

        box.appendChild(div);

    });

}


function renderHolidays(){

    const box=
        document.getElementById("holidayList");

    const holidays=
        settings.holidays || [];

    box.innerHTML="";

    holidays.forEach(date=>{

        const div=
            document.createElement("div");

        div.className="holiday";

        div.innerHTML=`

            ${escapeHtml(date)}

            <button
                onclick="removeHoliday('${date}')">
                ×
            </button>

        `;

        box.appendChild(div);

    });

}


async function addHoliday(){

    const date=
        document.getElementById("holidayDate").value;

    if(!date){

        alert("یک تاریخ انتخاب کن.");

        return;

    }

    try{

        const result=
            await api("/holidays",{

                method:"POST",

                body:JSON.stringify({
                    date:date
                })

            });

        settings.holidays=result.holidays;

        document.getElementById(
            "holidayDate"
        ).value="";

        await render();

    }catch(error){

        alert(
            "ثبت تعطیلی انجام نشد.\n\n"+
            error.message
        );

    }

}


async function removeHoliday(date){

    try{

        const result=
            await api(
                "/holidays/"+
                encodeURIComponent(date),
                {
                    method:"DELETE"
                }
            );

        settings.holidays=result.holidays;

        await render();

    }catch(error){

        alert(
            "حذف تعطیلی انجام نشد.\n\n"+
            error.message
        );

    }

}


function renderServices(){

    const box=
        document.getElementById("servicesAdmin");

    box.innerHTML="";

    Object.entries(services).forEach(
        ([name,price],index)=>{

            const row=
                document.createElement("div");

            row.className="service-row";

            row.innerHTML=`

                <input
                    data-service-name="${index}"
                    data-original-name="${escapeAttr(name)}"
                    value="${escapeAttr(name)}"
                >

                <input
                    data-service-price="${index}"
                    type="number"
                    value="${Number(price)}"
                >

            `;

            box.appendChild(row);

        }
    );

}


async function saveServices(){

    const names=
        document.querySelectorAll(
            "[data-service-name]"
        );

    const prices=
        document.querySelectorAll(
            "[data-service-price]"
        );

    const newServices={};

    names.forEach((input,index)=>{

        const name=
            input.value.trim();

        const price=
            Number(prices[index].value) || 0;

        if(name){
            newServices[name]=price;
        }

    });

    try{

        const result=
            await api("/services",{

                method:"PUT",

                body:JSON.stringify(newServices)

            });

        services=result.services;

        alert("قیمت‌ها ذخیره شد 💾");

        renderServices();

    }catch(error){

        alert(
            "ذخیره قیمت‌ها انجام نشد.\n\n"+
            error.message
        );

    }

}


async function clearBookings(){

    if(!confirm(
        "همه نوبت‌های تست حذف شوند؟"
    )){
        return;
    }

    try{

        await api("/bookings",{
            method:"DELETE"
        });

        alert("تمام نوبت‌های تست حذف شدند.");

        await render();

    }catch(error){

        alert(
            "حذف نوبت‌ها انجام نشد.\n\n"+
            error.message
        );

    }

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHtml(value);

}


async function render(){

    try{

        await Promise.all([
            loadSettings(),
            loadServices(),
            loadBookings()
        ]);

        const todayBookings=
            bookings.filter(b=>
                b.date===today() &&
                b.status!=="rejected"
            );

        const pending=
            bookings.filter(
                b=>b.status==="pending"
            );

        document.getElementById(
            "todayCount"
        ).textContent=
            todayBookings.length;

        document.getElementById(
            "pendingCount"
        ).textContent=
            pending.length;

        document.getElementById(
            "limitCount"
        ).textContent=
            Number(settings.daily_limit ?? 4);

        renderPending();
        renderAll();
        renderHolidays();
        renderServices();

    }catch(error){

        document.getElementById(
            "pendingBookings"
        ).innerHTML=
            `<div class="empty">
                ⚠️ اتصال به سرور برقرار نیست.
            </div>`;

        document.getElementById(
            "allBookings"
        ).innerHTML=
            `<div class="empty">
                آدرس API:
                127.0.0.1:5000
            </div>`;

    }

}


render();

setInterval(async()=>{

    try{

        await loadBookings();

        const pending=
            bookings.filter(
                b=>b.status==="pending"
            );

        const todayBookings=
            bookings.filter(b=>
                b.date===today() &&
                b.status!=="rejected"
            );

        document.getElementById(
            "todayCount"
        ).textContent=
            todayBookings.length;

        document.getElementById(
            "pendingCount"
        ).textContent=
            pending.length;

        renderPending();
        renderAll();

    }catch{}

},5000);

</script>

</body>
</html>
