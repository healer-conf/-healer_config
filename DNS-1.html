<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>SOLO VPN — PERFORMANCE DNS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#050505;
    --panel:#0b0b0b;
    --panel2:#101010;
    --line:#262626;
    --white:#f5f5f5;
    --gray:#8b8b8b;
    --gray2:#555;
    --red:#e10600;
    --red2:#ff3028;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%, #252525 0%, #090909 35%, #030303 75%);
    color:var(--white);
    font-family:'Vazirmatn',sans-serif;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.18;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.025) 4px
        );
}

/* ================= HEADER ================= */

.header{
    width:min(1100px,94%);
    margin:25px auto 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    border:1px solid var(--line);
    background:rgba(10,10,10,.88);
    backdrop-filter:blur(18px);
    position:relative;
    overflow:hidden;
}

.header:after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:35%;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--red),transparent);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brandMark{
    width:38px;
    height:38px;
    border:1px solid #444;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
    position:relative;
}

.brandMark:before{
    content:"";
    position:absolute;
    width:18px;
    height:1px;
    background:var(--red);
    bottom:7px;
}

.brandText{
    display:flex;
    flex-direction:column;
}

.brandText strong{
    font-size:15px;
    letter-spacing:2px;
}

.brandText span{
    color:#666;
    font-size:9px;
    letter-spacing:2px;
    direction:ltr;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10px;
    color:#777;
    direction:ltr;
}

.statusDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#777;
    box-shadow:0 0 10px rgba(255,255,255,.15);
}

.statusDot.active{
    background:#ddd;
    box-shadow:0 0 12px rgba(255,255,255,.5);
}

/* ================= MAIN ================= */

.container{
    width:min(1100px,94%);
    margin:auto;
}

/* ================= HERO ================= */

.hero{
    margin-top:25px;
    text-align:center;
}

.kicker{
    font-size:9px;
    color:#777;
    letter-spacing:4px;
    direction:ltr;
}

.hero h1{
    margin:8px 0 4px;
    font-size:clamp(28px,7vw,54px);
    font-weight:800;
    letter-spacing:5px;
    direction:ltr;
}

.hero p{
    margin:0;
    color:#686868;
    font-size:11px;
}

/* ================= DASHBOARD ================= */

.dashboard{
    display:none;
    margin:30px auto;
    width:min(650px,100%);
    padding:25px 20px 20px;
    border:1px solid #252525;
    background:
        radial-gradient(circle at 50% 45%,#171717 0%,#0b0b0b 50%,#070707 100%);
    box-shadow:
        0 30px 80px rgba(0,0,0,.6),
        inset 0 0 50px rgba(255,255,255,.015);
    position:relative;
}

.dashboard.show{
    display:block;
    animation:appear .5s ease;
}

.dashboard:before,
.dashboard:after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    border-color:#444;
    pointer-events:none;
}

.dashboard:before{
    top:8px;
    left:8px;
    border-top:1px solid;
    border-left:1px solid;
}

.dashboard:after{
    bottom:8px;
    right:8px;
    border-bottom:1px solid;
    border-right:1px solid;
}

.dashTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.dashTitle span:first-child{
    font-size:9px;
    color:#777;
    letter-spacing:2px;
    direction:ltr;
}

.speedNumber{
    direction:ltr;
    font-size:14px;
    font-weight:700;
    color:#aaa;
}

.gauge{
    position:relative;
    width:min(410px,90vw);
    aspect-ratio:1;
    margin:auto;
}

.gauge svg{
    width:100%;
    height:100%;
    overflow:visible;
}

.gauge-bg{
    fill:#080808;
    stroke:#252525;
    stroke-width:3;
}

.gauge-inner{
    fill:none;
    stroke:#171717;
    stroke-width:14;
}

.tick{
    stroke:#888;
    stroke-width:1.4;
}

.tick.major{
    stroke:#eee;
    stroke-width:2;
}

.tick.red{
    stroke:var(--red);
}

.tickText{
    fill:#aaa;
    font-size:11px;
    font-family:Arial,sans-serif;
    text-anchor:middle;
    dominant-baseline:middle;
}

.centerCircle{
    fill:#0a0a0a;
    stroke:#333;
    stroke-width:2;
}

.needle{
    stroke:#eee;
    stroke-width:3;
    stroke-linecap:round;
    transform-origin:200px 200px;
    transform:rotate(-135deg);
    filter:drop-shadow(0 0 5px rgba(255,255,255,.2));
}

.needleTip{
    fill:var(--red);
}

.centerDot{
    fill:#ddd;
}

.unit{
    fill:#666;
    font-size:10px;
    text-anchor:middle;
    letter-spacing:2px;
    font-family:Arial,sans-serif;
}

.digital{
    position:absolute;
    left:50%;
    top:57%;
    transform:translate(-50%,-50%);
    text-align:center;
    direction:ltr;
}

.digital strong{
    display:block;
    font-family:Arial,sans-serif;
    font-size:31px;
    letter-spacing:2px;
}

.digital span{
    font-size:8px;
    color:#666;
    letter-spacing:3px;
}

.redline{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--red),
        transparent
    );
    opacity:.35;
}

/* ================= SECTIONS ================= */

.sectionTitle{
    display:flex;
    align-items:center;
    gap:12px;
    margin:35px 0 15px;
}

.sectionTitle .line{
    flex:1;
    height:1px;
    background:#202020;
}

.sectionTitle strong{
    font-size:12px;
    letter-spacing:2px;
    direction:ltr;
}

.sectionTitle span{
    font-size:9px;
    color:#555;
    direction:ltr;
}

/* ================= MODE ================= */

.modes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.mode{
    min-height:72px;
    border:1px solid #292929;
    background:#0b0b0b;
    color:#777;
    cursor:pointer;
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.mode:hover{
    border-color:#555;
}

.mode.selected{
    color:#fff;
    border-color:#ddd;
    background:#111;
}

.mode.selected:after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:2px;
    background:var(--red);
}

.mode b{
    display:block;
    font-family:Arial,sans-serif;
    font-size:14px;
    letter-spacing:2px;
    direction:ltr;
}

.mode small{
    display:block;
    margin-top:6px;
    font-size:8px;
    color:#555;
}

.mode.selected small{
    color:#888;
}

.mode.disabled{
    opacity:.25;
    cursor:not-allowed;
}

/* ================= COUNTRY CARDS ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.card{
    position:relative;
    min-height:145px;
    padding:20px;
    background:
        linear-gradient(135deg,#121212,#080808);
    border:1px solid #292929;
    cursor:pointer;
    overflow:hidden;
    transition:
        transform .25s,
        border-color .25s,
        background .25s;
}

.card:before{
    content:"";
    position:absolute;
    width:130px;
    height:130px;
    border:1px solid #1d1d1d;
    border-radius:50%;
    right:-55px;
    bottom:-65px;
}

.card:after{
    content:"";
    position:absolute;
    width:70px;
    height:1px;
    background:#444;
    top:18px;
    left:-10px;
    transform:rotate(-45deg);
}

.card:hover{
    transform:translateY(-3px);
    border-color:#555;
}

.card.selected{
    border-color:#eee;
    background:
        linear-gradient(135deg,#171717,#090909);
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.04),
        0 15px 40px rgba(0,0,0,.35);
}

.card.selected .cardAccent{
    background:var(--red);
}

.cardAccent{
    position:absolute;
    top:0;
    right:0;
    width:100%;
    height:2px;
    background:#333;
}

.cardTop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    direction:ltr;
}

.cardCode{
    font-family:Arial,sans-serif;
    font-size:9px;
    color:#555;
    letter-spacing:2px;
}

.cardBadge{
    border:1px solid #303030;
    padding:3px 6px;
    font-size:7px;
    color:#666;
    direction:ltr;
}

.card.selected .cardBadge{
    border-color:#666;
    color:#ddd;
}

.country{
    margin-top:25px;
    direction:rtl;
}

.country h3{
    margin:0;
    font-size:19px;
    font-weight:700;
}

.country p{
    margin:4px 0 0;
    color:#555;
    font-size:9px;
}

.specs{
    position:absolute;
    bottom:15px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    direction:ltr;
}

.spec{
    font-size:7px;
    color:#555;
}

.spec strong{
    color:#aaa;
    font-family:Arial,sans-serif;
    font-size:10px;
}

/* ================= BUILD ================= */

.buildBox{
    margin:30px 0;
    padding:18px;
    border:1px solid #292929;
    background:#090909;
}

.buildBtn{
    width:100%;
    height:62px;
    border:1px solid #777;
    background:#ededed;
    color:#050505;
    font-family:'Vazirmatn',sans-serif;
    font-size:13px;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:.2s;
}

.buildBtn:before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,0,0,.12),
        transparent
    );
    transform:translateX(-100%);
    transition:.5s;
}

.buildBtn:hover:before{
    transform:translateX(100%);
}

.buildBtn:active{
    transform:scale(.99);
}

.buildBtn.running{
    background:#1a1a1a;
    color:#fff;
    border-color:#555;
}

/* ================= OUTPUT ================= */

.output{
    display:none;
    margin:20px 0 50px;
    border:1px solid #303030;
    background:#080808;
    overflow:hidden;
}

.output.show{
    display:block;
    animation:appear .5s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.outputHead{
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #222;
}

.outputHead strong{
    font-size:11px;
    direction:ltr;
}

.outputHead span{
    font-size:8px;
    color:#555;
}

.dnsList{
    padding:18px;
    display:grid;
    gap:8px;
}

.dns{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:50px;
    padding:0 14px;
    border:1px solid #222;
    background:#0d0d0d;
    direction:ltr;
}

.dns span{
    font-family:monospace;
    font-size:14px;
    color:#eee;
}

.dns small{
    color:#555;
    font-family:Arial,sans-serif;
    font-size:8px;
}

.copyBtn{
    margin:0 18px 18px;
    width:calc(100% - 36px);
    height:45px;
    border:1px solid #444;
    background:#111;
    color:#ddd;
    cursor:pointer;
    font-family:'Vazirmatn',sans-serif;
    font-size:10px;
}

.copyBtn:active{
    background:#222;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;
    padding:10px 0 35px;
    color:#444;
    font-size:9px;
}

.footer strong{
    color:#aaa;
    direction:ltr;
}

.footer a{
    color:#888;
    text-decoration:none;
    direction:ltr;
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    .header{
        margin-top:12px;
        padding:13px;
    }

    .brandText strong{
        font-size:12px;
    }

    .hero{
        margin-top:20px;
    }

    .hero h1{
        font-size:28px;
        letter-spacing:3px;
    }

    .dashboard{
        padding:17px 8px;
    }

    .gauge{
        width:94vw;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        min-height:130px;
    }

    .modes{
        gap:7px;
    }

    .mode{
        min-height:67px;
    }

    .mode b{
        font-size:11px;
    }

    .mode small{
        font-size:7px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="brandMark">S</div>

        <div class="brandText">
            <strong>SOLO VPN</strong>
            <span>PERFORMANCE DNS SYSTEM</span>
        </div>
    </div>

    <div class="status">
        <div class="statusDot" id="statusDot"></div>
        <span id="statusText">STANDBY</span>
    </div>

</header>


<main class="container">

    <section class="hero">
        <div class="kicker">PRECISION • SPEED • CONTROL</div>

        <h1>DNS PERFORMANCE</h1>

        <p>
            پروفایل موردنظر را انتخاب کنید و سیستم را اجرا کنید
        </p>
    </section>


    <!-- MODE -->

    <div class="sectionTitle">
        <div class="line"></div>
        <strong>DNS MODE</strong>
        <span>01</span>
        <div class="line"></div>
    </div>

    <div class="modes">

        <button
            class="mode selected"
            data-mode="v4"
            onclick="selectMode('v4')">

            <b>IPv4</b>
            <small>DUAL ADDRESS</small>

        </button>

        <button
            class="mode"
            data-mode="v6"
            onclick="selectMode('v6')">

            <b>IPv6</b>
            <small>DUAL ADDRESS</small>

        </button>

        <button
            class="mode"
            data-mode="both"
            onclick="selectMode('both')">

            <b>IPv4 + IPv6</b>
            <small>FULL PROFILE</small>

        </button>

    </div>


    <!-- LOCATIONS -->

    <div class="sectionTitle">
        <div class="line"></div>
        <strong>SELECT PROFILE</strong>
        <span>02</span>
        <div class="line"></div>
    </div>

    <div class="grid" id="countryGrid"></div>


    <!-- BUILD -->

    <div class="buildBox">

        <button
            class="buildBtn"
            id="buildBtn"
            onclick="buildDNS()">

            BUILD DNS PROFILE

        </button>

    </div>


    <!-- SPEEDOMETER (فقط بعد از زدن دکمه ساخت نمایش داده می‌شود) -->

    <section class="dashboard" id="dashboard">

        <div class="dashTitle">
            <span>PERFORMANCE METER</span>
            <span class="speedNumber">
                <span id="speedTop">0</span> KM/H
            </span>
        </div>

        <div class="gauge">

            <svg viewBox="0 0 400 400">

                <circle
                    cx="200"
                    cy="200"
                    r="174"
                    class="gauge-bg"
                />

                <circle
                    cx="200"
                    cy="200"
                    r="151"
                    class="gauge-inner"
                />

                <g id="ticks"></g>
                <g id="numbers"></g>

                <text
                    x="200"
                    y="246"
                    class="unit">
                    KM/H
                </text>

                <line
                    id="needle"
                    x1="200"
                    y1="200"
                    x2="200"
                    y2="65"
                    class="needle"
                />

                <circle
                    cx="200"
                    cy="200"
                    r="13"
                    class="centerCircle"
                />

                <circle
                    cx="200"
                    cy="200"
                    r="5"
                    class="centerDot"
                />

                <circle
                    id="needleTip"
                    cx="200"
                    cy="65"
                    r="3"
                    class="needleTip"
                />

            </svg>

            <div class="digital">
                <strong id="speedDigital">0</strong>
                <span>KM/H</span>
            </div>

        </div>

        <div class="redline"></div>

    </section>


    <!-- OUTPUT -->

    <section
        class="output"
        id="output">

        <div class="outputHead">
            <strong id="outputTitle">
                DNS PROFILE
            </strong>

            <span id="outputType">
                IPv4
            </span>
        </div>

        <div
            class="dnsList"
            id="dnsList">
        </div>

        <button
            class="copyBtn"
            onclick="copyDNS()">

            COPY DNS PROFILE

        </button>

    </section>


    <footer class="footer">

        <div>
            SOLO VPN
        </div>

        <div style="margin-top:6px">
            CHANNEL:
            <strong>@healer_config</strong>
        </div>

    </footer>

</main>

function createCard(profile, isVIP=false){

    const hasV6 = profile.v6.length === 2;

    const card = document.createElement("div");

    card.className = "card";

    card.dataset.id = profile.id;

    card.innerHTML = `

        <div class="cardAccent"></div>

        <div class="cardTop">

            <span class="cardCode">
                ${profile.code}
            </span>

            <span class="cardBadge">
                ${isVIP ? "VIP" : profile.badge}
            </span>

        </div>

        <div class="country">

            <h3>${profile.country}</h3>

            <p>

                }
            </p>

        </div>

        <div class="specs">

            <div class="spec">
                IPv4
                <strong>
                    ${profile.v4.length === 2 ? "02" : "00"}
                </strong>
            </div>

            <div class="spec">
                IPv6
                <strong>
                    ${hasV6 ? "02" : "00"}
                </strong>
            </div>

            <div class="spec">
                STATUS
                <strong>READY</strong>
            </div>

        </div>
    `;

    card.onclick = () => {

        if(
            selectedMode === "v6" &&
            !hasV6
        ){
            return;
        }

        if(
            selectedMode === "both" &&
            !hasV6
        ){
            return;
        }

        document
            .querySelectorAll(".card")
            .forEach(c => c.classList.remove("selected"));

        card.classList.add("selected");

        selectedProfile = profile;

        hideOutput();
    };

    return card;
}

function selectMode(mode){

    selectedMode = mode;

    document
        .querySelectorAll(".mode")
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                btn.dataset.mode === mode
            );

        });


    /*
       اگر حالت IPv6 یا هر دو انتخاب شود،
       پروفایل‌هایی که IPv6 ندارند قابل انتخاب نیستند.
    */

    if(
        selectedProfile &&
        (mode === "v6" || mode === "both") &&
        selectedProfile.v6.length !== 2
    ){
        selectedProfile = null;
    }

    renderProfiles();

    hideOutput();

}


/* =========================================================
   GAUGE
========================================================= */

const gaugeCenterX = 200;
const gaugeCenterY = 200;

const startAngle = -135;
const endAngle = 135;

const tickGroup =
    document.getElementById("ticks");

const numberGroup =
    document.getElementById("numbers");


for(let i=0;i<=36;i++){

    const speed = i * 10;

    const angle =
        startAngle +
        (endAngle-startAngle)*(i/36);

    const rad =
        angle*Math.PI/180;

    const outerR = 157;

    const innerR =
        i % 3 === 0
        ? 142
        : 148;

    const x1 =
        gaugeCenterX +
        Math.cos(rad)*innerR;

    const y1 =
        gaugeCenterY +
        Math.sin(rad)*innerR;

    const x2 =
        gaugeCenterX +
        Math.cos(rad)*outerR;

    const y2 =
        gaugeCenterY +
        Math.sin(rad)*outerR;

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.setAttribute("x1",x1);
    line.setAttribute("y1",y1);
    line.setAttribute("x2",x2);
    line.setAttribute("y2",y2);

    line.classList.add("tick");

    if(i % 3 === 0)
        line.classList.add("major");

    if(speed >= 300)
        line.classList.add("red");

    tickGroup.appendChild(line);


    if(i % 3 === 0){

        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        const textR = 126;

        const tx =
            gaugeCenterX +
            Math.cos(rad)*textR;

        const ty =
            gaugeCenterY +
            Math.sin(rad)*textR;

        text.setAttribute("x",tx);
        text.setAttribute("y",ty);

        text.textContent = speed;

        text.classList.add("tickText");

        numberGroup.appendChild(text);

    }

}


/* =========================================================
   SPEED ANIMATION
========================================================= */

function setSpeed(speed){

    const angle =
        startAngle +
        (endAngle-startAngle)*
        (speed/360);

    document
        .getElementById("needle")
        .style.transform =
        `rotate(${angle + 90}deg)`;

    document
        .getElementById("speedDigital")
        .textContent =
        Math.round(speed);

    document
        .getElementById("speedTop")
        .textContent =
        Math.round(speed);

}


/* =========================================================
   BUILD
   عقربه هم‌زمان با صدای supra.mp3 حرکت می‌کند:
   به محض زدن دکمه، صدا پخش می‌شود و عقربه دقیقاً
   به اندازه‌ی طول همان صدا (نه سریع‌تر، نه کندتر)
   از صفر تا 360 بالا می‌رود. وقتی صدا/انیمیشن تمام شد
   خروجی DNS نمایش داده می‌شود.
========================================================= */

/* مدت زمان پیش‌فرض (بر حسب میلی‌ثانیه) تا زمانی که
   طول واقعی فایل صوتی از خود فایل خوانده شود */
let soundDuration = 11500;

function buildDNS(){

    if(!selectedProfile){

        alert("ابتدا یک پروفایل را انتخاب کنید.");

        return;
    }


    if(
        (selectedMode === "v6" ||
         selectedMode === "both") &&
        selectedProfile.v6.length !== 2
    ){

        alert("این پروفایل IPv6 ندارد.");

        return;
    }


    const btn =
        document.getElementById("buildBtn");

    btn.classList.add("running");

    btn.disabled = true;

    btn.textContent =
        "BUILDING PERFORMANCE PROFILE...";


    document
        .getElementById("statusText")
        .textContent =
        "BUILDING";

    document
        .getElementById("statusDot")
        .classList.add("active");


    hideOutput();

    setSpeed(0);


    /*
       نمایش گیج درست زیر دکمه ساخت، هم‌زمان با شروع کار
    */

    const dashboard =
        document.getElementById("dashboard");

    dashboard.classList.add("show");

    setTimeout(() => {

        dashboard.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    },50);


    /*
       منطق PUBG VIP:

       IPv4:
       یکی از چهار پکیج به صورت تصادفی

       IPv4 + IPv6:
       فقط VIP 4

       IPv6:
       فقط VIP 4
    */

    let finalProfile =
        selectedProfile;


    const isPUBG =
        pubgVIP.some(
            p => p.id === selectedProfile.id
        );


    if(isPUBG){

        if(selectedMode === "v4"){

            const randomIndex =
                Math.floor(
                    Math.random() *
                    pubgVIP.length
                );

            finalProfile =
                pubgVIP[randomIndex];

        }else{

            finalProfile =
                pubgVIP.find(
                    p => p.id === "vip4"
                );

        }

    }
    else if(
        selectedProfile.variants &&
        selectedProfile.variants.length
    ){

        /*
           پروفایل‌هایی مثل ترکیه که چند کد DNS
           دارند: یکی به‌صورت رندوم انتخاب می‌شود
        */

        const randomIndex =
            Math.floor(
                Math.random() *
                selectedProfile.variants.length
            );

        const variant =
            selectedProfile.variants[randomIndex];

        finalProfile = {
            ...selectedProfile,
            v4: variant.v4,
            v6: variant.v6
        };

    }


    generatedDNS = [];


    if(selectedMode === "v4"){

        generatedDNS =
            [...finalProfile.v4];

    }
    else if(selectedMode === "v6"){

        generatedDNS =
            [...finalProfile.v6];

    }
    else{

        generatedDNS = [
            ...finalProfile.v4,
            ...finalProfile.v6
        ];

    }


    /*
       پخش صدا هم‌زمان با شروع حرکت عقربه
       (نه در انتها)
    */

    const sound =
        document.getElementById("supraSound");

    sound.currentTime = 0;

    sound.play().catch((err) => {

        console.log(
            "Audio playback requires browser permission."
        );

        showAudioError(err);

    });


    /*
       طول انیمیشن دقیقاً برابر با طول فایل صوتی است.
       اگر متادیتای صدا هنوز لود نشده باشد، از مقدار
       پیش‌فرض soundDuration استفاده می‌شود تا عقربه
       زودتر از صدا به انتها نرسد.
    */

    let duration = soundDuration;

    if(
        sound.duration &&
        isFinite(sound.duration) &&
        sound.duration > 0
    ){
        duration = sound.duration * 1000;
        soundDuration = duration;
    }


    const startTime =
        { value: null };


    function animate(now){

        if(startTime.value === null){
            startTime.value = now;
        }

        const elapsed =
            now-startTime.value;

        const progress =
            Math.min(
                elapsed/duration,
                1
            );


        /*
           حرکت خطی و آرام؛ بدون شتاب اولیه‌ی تند،
           تا کیلومتر شمار سریع پر نشود و حس هم‌زمانی
           با صدا حفظ شود.
        */

        const speed =
            progress*360;


        setSpeed(speed);


        if(progress < 1){

            requestAnimationFrame(animate);

        }else{

            setSpeed(360);

            finishBuild(finalProfile);

        }

    }


    requestAnimationFrame(animate);

}


/* =========================================================
   FINISH
========================================================= */

function finishBuild(profile){

    const btn =
        document.getElementById("buildBtn");

    btn.classList.remove("running");

    btn.disabled = false;

    btn.textContent =
        "BUILD DNS PROFILE";


    document
        .getElementById("statusText")
        .textContent =
        "READY";


    showOutput(profile);

}


/* =========================================================
   OUTPUT
========================================================= */

function showOutput(profile){

    const output =
        document.getElementById("output");

    const list =
        document.getElementById("dnsList");

    const title =
        document.getElementById("outputTitle");

    const type =
        document.getElementById("outputType");


    list.innerHTML = "";


    title.textContent =
        profile.country +
        " — DNS PROFILE";


    type.textContent =
        selectedMode === "v4"
        ? "IPv4"
        : selectedMode === "v6"
        ? "IPv6"
        : "IPv4 + IPv6";


    generatedDNS.forEach(
        (ip,index) => {

            const item =
                document.createElement("div");

            item.className = "dns";

            const family =
                ip.includes(":")
                ? "IPv6"
                : "IPv4";


            item.innerHTML = `

                <span>${ip}</span>

                <small>
                    ${family} ${index+1}
                </small>

            `;

            list.appendChild(item);

        }
    );


    /*
       یادداشت نسل ۶ / نسل ۴:
       اگر حالت IPv6 یا هر دو انتخاب شده باشد،
       زیر لیست توضیح می‌دهیم که نسل ۶ منطقه‌ای
       کار می‌کند و در صورت مشکل از نسل ۴ استفاده شود.
    */

    const oldNote =
        document.getElementById("genNote");

    if(oldNote) oldNote.remove();

    if(
        selectedMode === "v6" ||
        selectedMode === "both"
    ){

        const note =
            document.createElement("div");

        note.id = "genNote";

        note.style.cssText =
            "margin-top:10px;padding:10px 14px;" +
            "border:1px solid #333;background:#0d0d0d;" +
            "color:#999;font-size:10px;direction:rtl;" +
            "text-align:right;line-height:1.8;";

        note.textContent =
            "کد DNS نسل شش (IPv6) به‌صورت منطقه‌ای کار می‌کند؛ " +
            "در صورت کار نکردن، از نسل چهار (IPv4) استفاده کنید.";

        list.appendChild(note);

    }


    output.classList.add("show");

    setTimeout(() => {

        output.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    },100);

}


/* =========================================================
   COPY
========================================================= */

function copyDNS(){

    if(!generatedDNS.length)
        return;


    const text =
        generatedDNS.join("\n");


    navigator.clipboard
        .writeText(text)
        .then(() => {

            const btn =
                document.querySelector(".copyBtn");

            const old =
                btn.textContent;

            btn.textContent =
                "COPIED SUCCESSFULLY";

            setTimeout(() => {

                btn.textContent = old;

            },1500);

        })
        .catch(() => {

            alert(
                "کپی خودکار توسط مرورگر انجام نشد."
            );

        });

}


/* =========================================================
   HIDE OUTPUT
========================================================= */

function hideOutput(){

    document
        .getElementById("output")
        .classList.remove("show");

    document
        .getElementById("dashboard")
        .classList.remove("show");

}


/* =========================================================
   AUDIO ERROR DISPLAY
   اگر صدا به هر دلیلی پخش نشد، دلیل دقیقش رو
   روی خود صفحه (نه فقط کنسول) نشون می‌دیم.
========================================================= */

function showAudioError(err){

    let box =
        document.getElementById("audioErrorBox");

    if(!box){

        box = document.createElement("div");

        box.id = "audioErrorBox";

        box.style.cssText =
            "margin:10px 0;padding:12px;border:1px solid #e10600;" +
            "background:#1a0000;color:#ff8080;font-size:11px;" +
            "direction:rtl;text-align:right;";

        document
            .getElementById("dashboard")
            .after(box);

    }

    box.textContent =
        "صدا پخش نشد. دلیل مرورگر: " +
        (err && err.name ? err.name : "نامشخص") +
        " — " +
        (err && err.message ? err.message : "");

}


/* =========================================================
   INITIALIZE
========================================================= */

renderProfiles();

setSpeed(0);

/* از قبل طول واقعی فایل صوتی را می‌خوانیم تا انیمیشن
   همان لحظه‌ی اول دقیق‌ترین مقدار را داشته باشد */
document
    .getElementById("supraSound")
    .addEventListener("loadedmetadata", function(){

        if(
            this.duration &&
            isFinite(this.duration) &&
            this.duration > 0
        ){
            soundDuration = this.duration * 1000;
        }

    });

</script>
